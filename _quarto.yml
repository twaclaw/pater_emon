project:
  type: book
  output-dir: _book
  resources:
    - assets/js/**
    - assets/audio/**

book:
  title: "Πάτερ ἡμῶν"
  output-file: pater-emon
  date: last-modified
  search: true
  reader-mode: true
  page-footer:
    left: "Texts from Wikipedia, reused under CC BY-SA 4.0"
    right: "Built with [Quarto](https://quarto.org)"
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    # Source languages first, then the vernaculars they were carried into.
    - chapters/ancient-greek.qmd
    - chapters/latin.qmd
    - chapters/lithuanian.qmd
    - chapters/spanish.qmd
    - chapters/italian.qmd
    - chapters/german.qmd
    - chapters/english.qmd
    - chapters/ukrainian.qmd
    - chapters/sources.qmd

filters:
  - assets/prayer.lua

format:
  pdf:
    documentclass: scrbook
    papersize: a5
    classoption: [DIV=12, oneside]
    pdf-engine: lualatex
    # EB Garamond is the web book's face and the only one here that covers
    # every script in it: polytonic Greek, the transliteration diacritics and
    # the Lithuanian and Spanish accents.
    mainfont: "EB Garamond"
    fontsize: 11pt
    linestretch: 1.15
    geometry:
      - top=18mm
      - bottom=20mm
      - inner=18mm
      - outer=15mm
    toc: true
    toc-depth: 1
    number-sections: false
    colorlinks: true
    include-in-header:
      - assets/prayer.tex

  html:
    theme:
      light: [cosmo, assets/css/prayer.scss]
      dark: [darkly, assets/css/prayer.scss]
    include-in-header:
      - assets/include-head.html
    include-after-body:
      - assets/include-body.html
    toc: true
    toc-depth: 3
    lang: en
