name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # The PDF is set in EB Garamond, the only face in TeX Live that covers
      # polytonic Greek, the transliteration diacritics and the Lithuanian
      # accents at once. TinyTeX does not ship it, and a missing OTF is not
      # the kind of error Quarto auto-installs its way out of.
      - name: Install PDF fonts
        run: tlmgr install ebgaramond koma-script

      - name: Render book
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
